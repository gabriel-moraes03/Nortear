services:

  # ─── Infraestrutura ────────────────────────────────────────────────────────

  postgres-db:
    image: ankane/pgvector:latest
    container_name: nortear-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - nortear-network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: nortear-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    networks:
      - nortear-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: nortear-ollama
    ports:
      - "11434:11434"
    environment:
      # Serializa as inferências: 1 requisição por vez (evita estourar a RAM
      # quando chat e geração de embeddings acontecem ao mesmo tempo)
      - OLLAMA_NUM_PARALLEL=1
      # Mantém no máx. os 2 modelos (chat + embedding) carregados, sem mais
      - OLLAMA_MAX_LOADED_MODELS=2
      # Descarrega modelos ociosos após 5 min, liberando memória
      - OLLAMA_KEEP_ALIVE=5m
    networks:
      - nortear-network
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Para usar GPU NVIDIA, descomente as linhas abaixo:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── Microsserviços ─────────────────────────────────────────────────────────

  embedding-service:
    build:
      context: ./embedding-service
    container_name: nortear-embedding
    ports:
      - "8001:8001"
    environment:
      - VECTOR_DB_HOST=postgres-db
      - VECTOR_DB_NAME=vector_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=5432
      - OLLAMA_URL=http://ollama:11434
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - nortear-network
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  mcp-server:
    build:
      context: ./server-mcp
    container_name: nortear-mcp
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    networks:
      - nortear-network
    depends_on:
      - ollama
      - embedding-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: nortear-auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600000}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - nortear-network
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  chat-service:
    build:
      context: ./chat-service
    container_name: nortear-chat
    ports:
      - "${CHAT_PORT:-8082}:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MCP_SERVER_URL=http://mcp-server:8000
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-changeme}
      - EMBEDDING_SERVICE_URL=http://embedding-service:8001
    networks:
      - nortear-network
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mcp-server:
        condition: service_started
    restart: unless-stopped

  # ─── Jobs (rodar manualmente) ───────────────────────────────────────────────
  # Scraper: docker compose --profile jobs run --rm data-scraper
  # Processor: docker compose --profile jobs run --rm data-scraper python process.py

  data-scraper:
    build:
      context: ./data-service
    container_name: nortear-scraper
    profiles:
      - jobs
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=vagas_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    networks:
      - nortear-network
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: "no"

  api-gateway:
    build:
      context: ./gateway
    container_name: nortear-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AUTH_SERVICE_URL=http://auth-service:8081
      - CHAT_SERVICE_URL=http://chat-service:8082
    networks:
      - nortear-network
    depends_on:
      - auth-service
      - chat-service
    restart: unless-stopped

  frontend:
    build:
      context: ./front
    container_name: nortear-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - nortear-network
    depends_on:
      - api-gateway
    restart: unless-stopped

networks:
  nortear-network:
    driver: bridge

volumes:
  pgdata:
  kafka_data:
  ollama_data:
