<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Nortear</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex min-h-screen items-center justify-center font-sans antialiased py-12 px-4">

    <main class="w-full max-w-xl">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white mb-3 shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-compass text-xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    Nortear
                </h1>
                <p class="text-sm text-slate-400 mt-1">
                    Crie sua conta para gerar seu roadmap personalizado
                </p>
            </div>

            <form action="#" method="POST" class="space-y-6">
                
                <div>
                    <h2 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-user text-[10px]"></i> Dados de Acesso
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="name" class="block text-xs font-medium text-slate-400 mb-1.5">Nome Completo</label>
                            <input type="text" id="name" required placeholder="Seu nome" 
                                class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                        <div>
                            <label for="email" class="block text-xs font-medium text-slate-400 mb-1.5">E-mail</label>
                            <input type="email" id="email" required placeholder="dev@exemplo.com" 
                                class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                        </div>
                    </div>
                    <div class="mt-4">
                        <label for="password" class="block text-xs font-medium text-slate-400 mb-1.5">Senha</label>
                        <input type="password" id="password" required placeholder="Mínimo 8 caracteres" 
                            class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    </div>
                </div>

                <hr class="border-slate-800/60 my-2">

                <div>
                    <h2 class="text-xs font-semibold text-purple-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-bullseye text-[10px]"></i> Alvo do seu Roadmap
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="target-job" class="block text-sm font-medium text-slate-300 mb-1">Qual vaga você está buscando?</label>
                            <p class="text-[11px] text-slate-500 mb-1.5">Seja específico (ex: Desenvolvedor Frontend React Júnior)</p>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                                    <i class="fa-solid fa-briefcase text-xs"></i>
                                </span>
                                <input type="text" id="target-job" required placeholder="Ex: Desenvolvedor Node.js Pleno" 
                                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all">
                            </div>
                        </div>

                        <div>
                            <label for="current-skills" class="block text-sm font-medium text-slate-300 mb-1">Quais tecnologias/skills você já domina?</label>
                            <p class="text-[11px] text-slate-500 mb-1.5">Isso ajuda o RAG a filtrar o que você já sabe. Separe por vírgulas.</p>
                            <div class="relative">
                                <span class="absolute top-3 left-3.5 text-slate-500">
                                    <i class="fa-solid fa-code text-xs"></i>
                                </span>
                                <textarea id="current-skills" required rows="3" placeholder="Ex: HTML, CSS, JavaScript básico, Git..." 
                                    class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full mt-2 py-3 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold text-sm rounded-lg shadow-md shadow-purple-600/10 hover:shadow-purple-500/20 transition-all duration-150 cursor-pointer flex items-center justify-center gap-2">
                    <span>Criar Minha Conta & Traçar Rota</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="border-t border-slate-800/60 mt-6 pt-5 text-center">
                <p class="text-sm text-slate-400">
                    Já tem uma conta? <a href="/login.html" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">Fazer Login</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const dados = {
                nome: document.getElementById('name').value,
                email: document.getElementById('email').value,
                senha: document.getElementById('password').value,
                vagaDesejada: document.getElementById('target-job').value,
                skillsAtuais: document.getElementById('current-skills').value
            };

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    alert('Conta criada com sucesso! Redirecionando para o login...');
                    window.location.href = '/login.html';
                } else {
                    alert('Erro ao criar conta. Verifique os dados inseridos.');
                }
            } catch (error) {
                console.error('Erro na conexão com o servidor:', error);
            }
        });
    </script>
</body>
</html>
