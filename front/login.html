<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nortear</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 flex min-h-screen items-center justify-center font-sans antialiased">

    <main class="w-full max-w-md p-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white mb-3 shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-compass text-xl animate-pulse"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                    Nortear
                </h1>
                <p class="text-xs text-slate-400 mt-1.5 tracking-wide uppercase font-medium">
                    Roadmaps personalizados com MCP & RAG
                </p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email" required placeholder="seu@email.com" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="password" class="block text-sm font-medium text-slate-300">Senha</label>
                        <a href="#" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">Esqueceu a senha?</a>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" required placeholder="••••••••" 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-slate-950 border-slate-800 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900">
                        <label for="remember" class="ml-2 text-xs text-slate-400 select-none">Lembrar de mim</label>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-md shadow-indigo-600/10 hover:shadow-indigo-500/20 transition-all duration-150 cursor-pointer">
                    Entrar no Sistema
                </button>
            </form>

            <div class="border-t border-slate-800/60 mt-8 pt-6 text-center">
                <p class="text-sm text-slate-400">
                    Ainda não tem cadastro? <a href="/register.html" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors">Criar uma conta</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        document.querySelector('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('password').value;
            
            // Aqui você pode adicionar o fetch para a API de login quando criá-la no Spring
            console.log('Tentativa de login:', { email, senha });
        });
    </script>
</body>
</html>
