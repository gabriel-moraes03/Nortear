server:
  port: ${CHAT_PORT:8082}

spring:
  application:
    name: chat-service

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    username: ${POSTGRES_USER:root}
    password: ${POSTGRES_PASSWORD:rootpassword}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

api:
  security:
    token:
      secret: ${JWT_SECRET:minha_chave_secreta_super_segura_para_dev_123}

mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8000}

embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:8001}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:changeme}

---
spring:
  config:
    activate:
      on-profile: default
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/chat_db

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres-db:5432/chat_db
